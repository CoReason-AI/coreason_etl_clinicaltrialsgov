[tool.poetry]
name = "coreason_etl_clinicaltrialsgov"
version = "0.1.0"
description = "Fast, extensible Python ETL to maintain a local ClinicalTrialsGov mirror"
authors = ["Gowtham A Rao <gowtham.rao@coreason.ai>"]
license = "Prosperity-3.0"
readme = "README.md"
packages = [{include = "coreason_etl_clinicaltrialsgov", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12, <3.15"
loguru = "^0.7.2"
dlt = {extras = ["postgres"], version = "^1.20.0"}
polars = "^1.36.1"
pydantic = "^2.12.5"
types-requests = "^2.32.4.20250913"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
ruff = "^0.4.8"
pre-commit = "^3.7.1"
pytest-cov = "^5.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.26"
respx = "^0.22.0"
requests-mock = "^1.12.1"
types-requests = "^2.32.4.20250913"
types-pyyaml = "^6.0.12.20250915"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "coreason_etl_clinicaltrialsgov"
version = "0.1.0"
description = "Fast, extensible Python ETL to maintain a local ClinicalTrialsGov mirror"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gowtham A Rao", email = "gowtham.rao@coreason.ai" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/CoReason-AI/coreason_etl_clinicaltrialsgov"
Repository = "https://github.com/CoReason-AI/coreason_etl_clinicaltrialsgov"
Documentation = "https://github.com/CoReason-AI/coreason_etl_clinicaltrialsgov"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]
